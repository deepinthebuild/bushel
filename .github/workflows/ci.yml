name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-version: '1.30.0'
          bazelisk-cache: true
          repository-cache: true
          disk-cache: native-${{ matrix.os }}
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: bazel test //...
      - run: bazel build //cmd/bushel
      - run: bazel run //cmd/bushel -- -help
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-version: '1.30.0'
          bazelisk-cache: true
          repository-cache: true
          disk-cache: race
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: bazel test --config=race //...
      - name: Fuzz protocol and state boundaries
        run: |
          for target in \
            'internal/cas FuzzParseManifest' \
            'internal/cas FuzzParseDigest' \
            'internal/cas FuzzChunkSegmentation' \
            'internal/cas FuzzCatalogDigest' \
            'internal/cas FuzzCatalogRecord' \
            'internal/membership FuzzMembershipSnapshot' \
            'internal/membership FuzzMembershipRequest' \
            'internal/p2p FuzzSizedCIDCanonicalRoundTrip' \
            'internal/p2p FuzzRoutingCapacityHistory' \
            'internal/p2p FuzzSeedOfferParsing' \
            'internal/workspace FuzzMetadataAndLabel' \
            'internal/publication FuzzPublicationSnapshot' \
            'internal/publication FuzzPublicationJournal' \
            'internal/reapi FuzzParseResource' \
            'internal/reapi FuzzUploadTransition'; do
            read -r package fuzz <<< "$target"
            bazel run @rules_go//go -- test "./$package" -run='^$' -fuzz="^${fuzz}$" -fuzztime=10s -parallel=2
          done
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-version: '1.30.0'
          bazelisk-cache: true
          repository-cache: true
          disk-cache: cross
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Build all supported targets
        shell: bash
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              bazel build --platforms=@rules_go//go/toolchain:${os}_${arch} //cmd/bushel
            done
          done
      - name: Check generated BUILD files
        run: bazel run //:gazelle -- -mode=diff
      - name: Check Go formatting and module files
        run: |
          bazel run @rules_go//go -- fmt ./...
          bazel mod tidy
          git diff --exit-code
